plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.pernorama'
version = '0.2.0-beta.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'Pernorama'
                description = 'A declarative permission node library for Java.'
                url = 'https://github.com/NOAHSOFTKR/pernorama'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/NOAHSOFTKR/pernorama/blob/main/LICENSE'
                    }
                }

                scm {
                    url = 'https://github.com/NOAHSOFTKR/pernorama'
                    connection = 'scm:git:https://github.com/NOAHSOFTKR/pernorama.git'
                    developerConnection = 'scm:git:ssh://git@github.com/NOAHSOFTKR/pernorama.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'pernorama'
            url = version.endsWith('-SNAPSHOT')
                ? 'https://maven.kjh9211.kr/snapshots'
                : 'https://maven.kjh9211.kr/releases'

            credentials {
                username = project.findProperty('reposiliteUsername') ?: System.getenv('REPOSILITE_USERNAME')
                password = project.findProperty('reposilitePassword') ?: System.getenv('REPOSILITE_PASSWORD')
            }
        }
    }
}
